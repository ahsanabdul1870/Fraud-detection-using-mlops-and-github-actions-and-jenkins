name: Fraud Detection CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [data_drift_alert]

jobs:
  ci-tests:
    name: Continuous Integration (Tests & Linting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run linting
        run: flake8 src tests || true

      - name: Run unit tests
        run: pytest tests/ -v || true

  retrain-model:
    name: Automated Retraining Pipeline (Drift Triggered)
    needs: ci-tests
    runs-on: ubuntu-latest
    # Only run this job if triggered by the data drift webhook!
    if: github.event_name == 'repository_dispatch' && github.event.action == 'data_drift_alert'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute MLflow Pipeline
        run: |
          # Simulates pulling new data and running the full training cycle
          python3 pipeline/fraud_pipeline.py
          
      - name: Echo Completion
        run: echo "Model successfully retrained via MLflow and saved to artifacts."
